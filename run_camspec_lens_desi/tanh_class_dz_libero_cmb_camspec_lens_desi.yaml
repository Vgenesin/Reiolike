# Run tanh_class_dz_libero_cmb_camspec_lens_desi: tanh di CLASS reio_camb (= CAMB/Planck), y = (1+z)^1.5, Delta z libero U(0.1, 3).
# Likelihood: SENZA ASTROFISICA (CMB + BAO): ELiCA + Planck lowl.TT + CamSpec NPIPE TTTEEE + lensing PR4 + DESI DR2 BAO (niente astrofisica).
# LCDM tutto libero (logA, n_s, omega_b, omega_cdm, H0) + nuisance di CamSpec
# (le aggiunge la likelihood con i suoi prior).  Prior di z_re e Delta z come le
# run run_tanh/tanh_planck_*; prior LCDM come run_ilic/.
#
# Identica a run_camspec/tanh_class_dz_libero_cmb_camspec.yaml piu' lensing PR4 e DESI DR2.
# Le quattro run di run_camspec_lens_desi/ sono identiche tranne reio_delta_z, la
# presenza di Reiolike.ReioLike e output.  Si lancia dalla radice del repository:
#   sbatch run_camspec_lens_desi/run_tanh_class_dz_libero_cmb_camspec_lens_desi.sh

debug: False

params:
  # --- reionizzazione -------------------------------------------------------
  reio_z_re:
    prior: {min: 5.0, max: 12.0}
    ref: {dist: norm, loc: 7.2, scale: 0.3}
    proposal: 0.1
    latex: z_\mathrm{re}
  reio_delta_z:
    prior: {min: 0.1, max: 3.0}
    ref: {dist: norm, loc: 1.0, scale: 0.2}
    proposal: 0.1
    latex: \Delta z

  # --- LCDM libero ------------------------------------------------------------
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.045, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true                       # campionato logA, a CLASS va A_s
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.003
    latex: n_\mathrm{s}
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
    latex: \omega_\mathrm{b}
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.120, scale: 0.001}
    proposal: 0.0005
    latex: \omega_\mathrm{cdm}
  H0:
    prior: {min: 40.0, max: 100.0}
    ref: {dist: norm, loc: 67.5, scale: 0.5}
    proposal: 0.5
    latex: H_0
  N_ur: 0.00441              # 3 neutrini massivi degeneri: N_eff = 3.044

  # --- derivati ---------------------------------------------------------------
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh_class
    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini massivi degeneri da 0.02 eV (somma 0.06 eV)
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611
      # recfast, non HyRec (default di CLASS): sul cluster HyRec in punti rari da' NaN
      # nella termodinamica a z < 0.7 o un segfault (21 nov 2026); recfast li calcola
      # bene e differisce da HyRec di <= 0.2% sui Cl, 1e-8 su tau.
      recombination: recfast

likelihood:
  elica: null
  planck_2018_lowl.TT: null                 # Commander, TT l = 2-29
  planck_NPIPE_highl_CamSpec.TTTEEE: null   # CamSpec PR4 (NPIPE), TT TE EE l > 30
  planckpr4lensing.PlanckPR4Lensing: null   # lensing PR4 (Carron et al. 2022), con la CMB primaria
  bao.desi_dr2.desi_bao_all: null           # DESI DR2 BAO, tutti i traccianti

sampler:
  mcmc:
    # covmat: nessuna a mano, cobaya sceglie la piu' vicina fra quelle di
    # planck_supp_data_and_covmats (LCDM + nuisance CamSpec) e poi la impara.
    Rminus1_stop: 0.01        # convergenza delle medie
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/tanh_class_dz_libero_cmb_camspec_lens_desi/tanh_class_dz_libero_cmb_camspec_lens_desi
