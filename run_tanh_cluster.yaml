# Run MCMC per il cluster: storia tanh (z_re, Delta z liberi) + astrofisica di
# corecon_config.yaml, cosmologia fissata a Planck 2018 (nessun dato CMB).
#
# Differenze rispetto a test_elica_reiolike.yaml:
#   - A_s FISSO: senza dati CMB non entra nella likelihood (logL identica con
#     A_s = 2.1e-9 e 3.0e-9), campionarlo aggiungeva solo una dimensione piatta;
#   - tau_reio DERIVATO, cosi' la catena lo salva;
#   - debug spento, criterio di convergenza (Gelman-Rubin) invece di max_samples.
#
# Si lancia dalla radice del repository (per i percorsi relativi):
#     cobaya-run run_tanh_cluster.yaml                 # una catena
#     mpirun -n 4 cobaya-run run_tanh_cluster.yaml     # 4 catene in parallelo

debug: False

params:
  reio_z_re:
    prior: {min: 5.0, max: 12.0}
    ref: {dist: norm, loc: 7.2, scale: 0.3}
    proposal: 0.1
    latex: z_\mathrm{re}
  reio_delta_z:
    prior: {min: 0.1, max: 3.0}
    ref: {dist: norm, loc: 1.0, scale: 0.2}
    proposal: 0.1
    latex: \Delta z

  # cosmologia fissata (Planck 2018), nomi di CLASS
  A_s: 2.0989e-9
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 2.0328

  # derivato: la profondita' ottica calcolata da CLASS
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh
    z_max: 30.0
    z_points: 250
    extra_args:
      N_ncdm: 1
      m_ncdm: 0.06
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False

sampler:
  mcmc:
    Rminus1_stop: 0.01        # convergenza delle medie
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/tanh/run
