# Run tanh_planck_dz_fisso05: tanh di CLASS reio_camb con dz = 0.5 fisso: la convenzione di Planck.
# Likelihood: astrofisica (corecon_config.yaml) + ELiCA + Planck lowl.TT.
# Campionati: z_re, A_s (dz fisso a 0.5).  Cosmologia fissa: Pagano et al. 2020,
# Tab. 3, TTTEEE+lowE-S2.
#
# Le quattro run (run_tanh/*.yaml) sono identiche tranne reio_model, reio_delta_z
# e output.  Si lancia dalla radice del repository:
#   sbatch run_tanh/run_tanh_planck_dz_fisso05.sh

debug: False

params:
  reio_z_re:
    prior: {min: 5.0, max: 12.0}
    ref: {dist: norm, loc: 7.2, scale: 0.3}
    proposal: 0.1
    latex: z_\mathrm{re}
  reio_delta_z: 0.5          # fisso

  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}
    proposal: 2.0e-11
    latex: A_s

  # cosmologia fissa: Pagano et al. 2020 (arXiv:1908.09856), Tab. 3, TTTEEE+lowE-S2
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 2.0328

  tau_reio:                  # derivato
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh_class
    z_max: 30.0
    z_points: 250
    extra_args:
      N_ncdm: 1
      m_ncdm: 0.06
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False
  elica: null
  planck_2018_lowl.TT: null

sampler:
  mcmc:
    Rminus1_stop: 0.01        # convergenza delle medie
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/tanh_planck_dz_fisso05/tanh_planck_dz_fisso05_corecon_ELiCA_lowTT
