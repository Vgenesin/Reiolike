# Run MCMC per il cluster: storia tanh_class (la tanh di CLASS reio_camb, in
# y = (1+z)^1.5, come CAMB/Planck), z_re, Delta z e A_s campionati, piu'
# l'astrofisica di corecon_config.yaml; resto della cosmologia fissato a
# Pagano et al. 2020, Tab. 3, TTTEEE+lowE-S2 (nessun dato CMB).
#
# Differenze rispetto a test_elica_reiolike.yaml:
#   - tau_reio DERIVATO, cosi' la catena lo salva;
#   - debug spento, criterio di convergenza (Gelman-Rubin) invece di max_samples.
# Senza dati CMB A_s non entra nella likelihood: la sua posteriore sara' il
# prior piatto. Si campiona per avere la stessa parametrizzazione delle run
# con la CMB.
#
# Si lancia dalla radice del repository (per i percorsi relativi):
#     cobaya-run run_tanh_class_cluster.yaml -r              # una catena
#     mpirun -n 4 cobaya-run run_tanh_class_cluster.yaml -r  # 4 catene in parallelo

debug: False

params:
  reio_z_re:
    prior: {min: 5.0, max: 12.0}
    ref: {dist: norm, loc: 7.2, scale: 0.3}
    proposal: 0.1
    latex: z_\mathrm{re}
  reio_delta_z:
    prior: {min: 0.1, max: 3.0}
    ref: {dist: norm, loc: 1.0, scale: 0.2}
    proposal: 0.1
    latex: \Delta z

  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}   # Pagano+2020, Tab. 3
    proposal: 2.0e-11
    latex: A_s

  # cosmologia fissata: Pagano et al. 2020 (arXiv:1908.09856), Tab. 3, ultima
  # colonna (TTTEEE+lowE-S2, medie 68%), nomi di CLASS
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 2.0328

  # derivato: la profondita' ottica calcolata da CLASS
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh_class
    z_max: 30.0
    z_points: 250
    extra_args:
      N_ncdm: 1
      m_ncdm: 0.06
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False

sampler:
  mcmc:
    Rminus1_stop: 0.01        # convergenza delle medie
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/tanh_class_zre_dz_As/tanh_class_zre_dz_As_corecon_ELiCA_lowTT_astro
