# PolyChord (nested sampling) sulla binned, schema C9: 9 bin + A_s = 10 parametri.
# Stesso modello, stessi dati e stessa cosmologia di analisi_numero_bin/cluster/binned_C9.yaml
# (3 neutrini massivi degeneri da 0.02 eV, N_ur 0.00441 -> N_eff = 3.044); cambiano
# solo il sampler e la cartella di output. Le catene MCMC in chains/binned_cmb/ non si toccano.
#
# bordi: [5.35, 6.05, 6.45, 6.75, 7.15, 7.45, 9.5, 12.0, 16.0, 25.0]
#
# Cosa da' in piu' rispetto all'MCMC: l'evidenza log(Z), scritta in
#   chains/polychord_binned/C9/binned_C9_polychord_ELiCA_lowTT.logZ
# e nel log del job ("log(Z) = ... +/- ..."). Confrontando log(Z) fra C6..C9 si sceglie
# il numero di bin. I pesi delle catene sono numeri reali, getdist le legge come al solito.
#
# Si lancia dalla radice del repository:
#   sbatch run_polychord_binned/run_binned_C9_polychord.sh
# Un job interrotto (limite di 24 h) riparte da dove era con lo stesso comando (-r).
#
# Nota: ref e proposal qui sotto servono solo all'MCMC; PolyChord campiona dal prior.

debug: False

params:
  # --- i bin: frazione ionizzata x_HII, prior piatto U(0, 1) ---------------
  reio_xHII_bin1:          # z in [5.35, 6.05]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.96, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(1)}
  reio_xHII_bin2:          # z in [6.05, 6.45]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.81, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(2)}
  reio_xHII_bin3:          # z in [6.45, 6.75]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.82, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(3)}
  reio_xHII_bin4:          # z in [6.75, 7.15]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.64, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(4)}
  reio_xHII_bin5:          # z in [7.15, 7.45]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.28, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(5)}
  reio_xHII_bin6:          # z in [7.45, 9.5]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.1, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(6)}
  reio_xHII_bin7:          # z in [9.5, 12.0]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.1, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(7)}
  reio_xHII_bin8:          # z in [12.0, 16.0]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.1, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(8)}
  reio_xHII_bin9:          # z in [16.0, 25.0]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.1, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(9)}

  # --- ampiezza: libera, la CMB la vede ------------------------------------
  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}
    proposal: 2.0e-11
    latex: A_s

  # --- cosmologia fissa: Pagano et al. 2020, Tab. 3, TTTEEE+lowE-S2 ---------
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 0.00441              # 3 neutrini massivi degeneri: N_eff = 3.044

  # --- derivato -------------------------------------------------------------
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: binned
    reio_bin_fixed_scheme: True     # True = usa reio_bin_edges qui sotto
    reio_bin_edges: [5.35, 6.05, 6.45, 6.75, 7.15, 7.45, 9.5, 12.0, 16.0, 25.0]
    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini massivi degeneri da 0.02 eV (somma 0.06 eV)
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False
  elica: null
  planck_2018_lowl.TT: null

sampler:
  polychord:
    nlive: 25d            # punti vivi: 25 x 10 = 250; l'errore su log(Z) va come 1/sqrt(nlive)
    num_repeats: 5d       # passi di slice sampling per punto: 5d come consigliato per evidenze accurate
    precision_criterion: 0.001   # si ferma quando i punti vivi contengono < 0.1% dell'evidenza
    do_clustering: True   # cerca e segue modi separati

output: chains/polychord_binned/C9/binned_C9_polychord_ELiCA_lowTT
