# Run power_law_2pow_ilic: power law 2-pow come in Ilic et al. 2025
# (arXiv:2504.13254, Tab. 1-2), con lo STESSO setup di run_ilic/tanh_ilic.yaml:
#   - solo CMB Planck PR4: LoLLiPoP EE (l = 2-30), HiLLiPoP TTTEEE (l > 30),
#     Commander lowl TT (PR3); niente dati astrofisici;
#   - LCDM tutto libero (omega_b, omega_cdm, H0, A_s, n_s) + nuisance di HiLLiPoP;
#   - power law: z_end ~ U(5, 20), alpha ~ U(0, 20), z_beg = 20 fisso;
#   - 3 neutrini degeneri da 0.02 eV, N_ur 0.00441 (N_eff = 3.044);
#   - tau integrato fino a z = 30; convergenza R-1 < 0.01.
# Differenza: il paper usa ECLAIR (emcee/zeus), qui il Metropolis di cobaya.
#
# Si lancia dalla radice del repository:
#   sbatch run_ilic/run_power_law_2pow_ilic.sh

debug: False

params:
  # --- reionizzazione: power law 2-pow (z_beg fisso a 20, nella theory) -----
  reio_z_end:
    prior: {min: 5.0, max: 20.0}
    ref: {dist: norm, loc: 6.0, scale: 0.3}
    proposal: 0.3
    latex: z_\mathrm{end}
  reio_alpha:
    prior: {min: 0.0, max: 20.0}
    ref: {dist: norm, loc: 4.0, scale: 0.5}
    proposal: 0.5
    latex: \alpha

  # --- LCDM libero ------------------------------------------------------------
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.045, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true                       # campionato logA, a CLASS va A_s
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.003
    latex: n_\mathrm{s}
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
    latex: \omega_\mathrm{b}
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.120, scale: 0.001}
    proposal: 0.0005
    latex: \omega_\mathrm{cdm}
  H0:
    prior: {min: 40.0, max: 100.0}
    ref: {dist: norm, loc: 67.5, scale: 0.5}
    proposal: 0.5
    latex: H_0
  N_ur: 0.00441              # 3 neutrini massivi degeneri: N_eff = 3.044

  # --- derivati ---------------------------------------------------------------
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: power_law
    reio_z_beg: 20.0          # 2-pow: inizio fisso a z = 20
    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini degeneri da 0.02 eV (somma 0.06 eV), come nel paper
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611

likelihood:
  planck_2020_lollipop.lowlE: null     # EE, l = 2-30
  planck_2020_hillipop.TTTEEE: null    # TT TE EE, l > 30
  planck_2018_lowl.TT: null            # Commander, TT l = 2-29

sampler:
  mcmc:
    # covmat di partenza: quella imparata dalla run tanh_ilic (13 nov, 117k
    # passi): cosmologia + nuisance di HiLLiPoP.  La riga della z_re della tanh
    # qui non serve e cobaya la ignora; i parametri della power law partono
    # dalle proposal qui sopra.  La posteriore non cambia, cobaya la aggiorna.
    covmat: run_ilic/power_law_ilic.covmat
    Rminus1_stop: 0.01        # come il paper
    Rminus1_cl_stop: 0.1
    max_tries: 10000
    learn_proposal: True

output: chains/power_law_2pow_ilic/power_law_2pow_ilic_PR4
