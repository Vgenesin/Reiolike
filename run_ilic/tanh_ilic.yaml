# Run tanh_ilic: riproduzione del caso "tanh" di Ilic et al. 2025
# (arXiv:2504.13254, Tab. 2).  Valore del paper (posteriore grezza):
#     tau = 0.0576 +- 0.0061
#
# Come nel paper:
#   - solo CMB Planck PR4: LoLLiPoP EE (l = 2-30), HiLLiPoP TTTEEE (l > 30),
#     Commander lowl TT (PR3); niente dati astrofisici;
#   - LCDM tutto libero (omega_b, omega_cdm, H0, A_s, n_s) + nuisance di
#     HiLLiPoP (li aggiunge la likelihood da sola, con i suoi prior);
#   - tanh alla CAMB/CLASS (reio_model tanh_class, y = (1+z)^1.5),
#     Delta z = 0.5 fisso, z_re ~ U(5, 25);
#   - elio: seconda reionizzazione tanh a z = 3.5, larghezza 0.5;
#   - 3 neutrini degeneri, somma delle masse 0.06 eV;
#   - tau integrato fino a z = 30;
#   - convergenza R-1 < 0.01.
# Differenza: il paper usa ECLAIR (emcee/zeus), qui il Metropolis di cobaya.
#
# Si lancia dalla radice del repository:
#   sbatch run_ilic/run_tanh_ilic.sh

debug: False

params:
  # --- reionizzazione -------------------------------------------------------
  reio_z_re:
    prior: {min: 5.0, max: 25.0}
    ref: {dist: norm, loc: 7.7, scale: 0.5}
    proposal: 0.3
    latex: z_\mathrm{re}
  reio_delta_z: 0.5          # fisso, come il tanh del paper

  # --- LCDM libero ------------------------------------------------------------
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.045, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true                       # campionato logA, a CLASS va A_s
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.003
    latex: n_\mathrm{s}
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
    latex: \omega_\mathrm{b}
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.120, scale: 0.001}
    proposal: 0.0005
    latex: \omega_\mathrm{cdm}
  H0:
    prior: {min: 40.0, max: 100.0}
    ref: {dist: norm, loc: 67.5, scale: 0.5}
    proposal: 0.5
    latex: H_0
  N_ur: 0.00441              # con 3 neutrini massivi degeneri: N_eff = 3.044

  # --- derivati ---------------------------------------------------------------
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh_class
    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini degeneri da 0.02 eV (somma 0.06 eV), come nel paper
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611

likelihood:
  planck_2020_lollipop.lowlE: null     # EE, l = 2-30
  planck_2020_hillipop.TTTEEE: null    # TT TE EE, l > 30
  planck_2018_lowl.TT: null            # Commander, TT l = 2-29

sampler:
  mcmc:
    covmat: auto              # covmat di Planck se c'e' tra i pacchetti: solo partenza piu' veloce
    Rminus1_stop: 0.01        # come il paper
    Rminus1_cl_stop: 0.1
    max_tries: 10000
    learn_proposal: True

output: chains/tanh_ilic/tanh_ilic_PR4
