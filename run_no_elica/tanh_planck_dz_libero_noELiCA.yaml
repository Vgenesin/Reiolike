# Run tanh_planck_dz_libero_noELiCA: come run_tanh/tanh_planck_dz_libero.yaml, ma SENZA ELiCA (niente EE a grandi scale).
# Likelihood: astrofisica (corecon_config.yaml) + Planck lowl.TT.
# Cambiano solo due cose rispetto a run_tanh/tanh_planck_dz_libero.yaml: tolta la riga 'elica: null' e
# l'output, che va in chains/no_ELICA/.  3 neutrini massivi, N_eff = 3.044.
#
# Si lancia dalla radice del repository:
#   sbatch run_no_elica/run_tanh_planck_dz_libero_noELiCA.sh

debug: False

params:
  reio_z_re:
    prior: {min: 5.0, max: 12.0}
    ref: {dist: norm, loc: 7.2, scale: 0.3}
    proposal: 0.1
    latex: z_\mathrm{re}
  reio_delta_z:
    prior: {min: 0.1, max: 3.0}
    ref: {dist: norm, loc: 1.0, scale: 0.2}
    proposal: 0.1
    latex: \Delta z

  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}
    proposal: 2.0e-11
    latex: A_s

  # cosmologia fissa: Pagano et al. 2020 (arXiv:1908.09856), Tab. 3, TTTEEE+lowE-S2
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 0.00441              # 3 neutrini massivi degeneri: N_eff = 3.044

  tau_reio:                  # derivato
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh_class
    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini massivi degeneri da 0.02 eV (somma 0.06 eV)
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False
  planck_2018_lowl.TT: null

sampler:
  mcmc:
    Rminus1_stop: 0.01        # convergenza delle medie
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/no_ELICA/tanh_planck_dz_libero_noELiCA/tanh_planck_dz_libero_noELiCA_corecon_lowTT
