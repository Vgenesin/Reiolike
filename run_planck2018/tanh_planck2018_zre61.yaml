# Run tanh_planck2018_zre61: la tanh "alla Planck 2018", per confronto con il risultato
# astrofisica + CMB (run_tanh/tanh_planck_dz_fisso05.yaml).
# Come Planck 2018 (VI, sez. 7.8): tanh di CAMB/CLASS (reio_model tanh_class,
# y = (1+z)^1.5) con Delta z = 0.5 fisso e z_re >= 6.1, cosi' che la
# reionizzazione sia completa a z = 6.  Nessun dato astrofisico.
# Likelihood: ELiCA + Planck lowl.TT.  Cosmologia fissa: Pagano et al. 2020;
# A_s libero; 3 neutrini massivi, N_eff = 3.044.
# Differenza da Planck: qui il prior e' piatto su z_re (Planck: piatto su tau).
#
# Si lancia dalla radice del repository:
#   sbatch run_planck2018/run_tanh_planck2018_zre61.sh

debug: False

params:
  reio_z_re:
    prior: {min: 6.1, max: 15.0}     # z_re >= 6.1: reionizzazione completa a z = 6 (Planck 2018)
    ref: {dist: norm, loc: 7.8, scale: 0.5}
    proposal: 0.1
    latex: z_\mathrm{re}
  reio_delta_z: 0.5          # fisso, come la tanh standard di CAMB/CLASS

  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}
    proposal: 2.0e-11
    latex: A_s

  # cosmologia fissa: Pagano et al. 2020 (arXiv:1908.09856), Tab. 3, TTTEEE+lowE-S2
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 0.00441              # 3 neutrini massivi degeneri: N_eff = 3.044

  tau_reio:                  # derivato
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: tanh_class
    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini massivi degeneri da 0.02 eV (somma 0.06 eV)
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611

likelihood:
  elica: null
  planck_2018_lowl.TT: null

sampler:
  mcmc:
    Rminus1_stop: 0.01        # convergenza delle medie
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/planck2018/tanh_planck2018_zre61/tanh_planck2018_zre61_ELiCA_lowTT
