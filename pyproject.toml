[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Reiolike"
version = "0.1.0"
description = "A Cobaya likelihood for reionization history using corecon"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cobaya",
    "numpy",
    "corecon",
    "matplotlib>=3.9.4",
]

[tool.hatch.build.targets.wheel]
packages = ["Reiolike"]

[tool.ruff]
lint.extend-select = ["I", "E", "W", "F", "E501"]
lint.ignore = []
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
