# Screening del numero di bin con la CMB a larga scala: schema C6, 6 bin.
# Generato da analisi_numero_bin/screening_cmb.py: per cambiarlo, cambia lo
# script e rigeneralo (python analisi_numero_bin/screening_cmb.py yaml).
#
# bordi: [5.35, 6.05, 6.45, 6.75, 7.15, 7.45, 25.0]
#
# Si lancia dalla radice del repository:
#   sbatch analisi_numero_bin/cluster/run_binned_C6.sh
# oppure a mano:
#   mpirun -n 4 cobaya-run analisi_numero_bin/cluster/binned_C6.yaml -r

debug: False

params:
  # --- i bin: frazione ionizzata x_HII, prior piatto U(0, 1) ---------------
  reio_xHII_bin1:          # z in [5.35, 6.05]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.96, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(1)}
  reio_xHII_bin2:          # z in [6.05, 6.45]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.81, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(2)}
  reio_xHII_bin3:          # z in [6.45, 6.75]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.82, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(3)}
  reio_xHII_bin4:          # z in [6.75, 7.15]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.64, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(4)}
  reio_xHII_bin5:          # z in [7.15, 7.45]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.28, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(5)}
  reio_xHII_bin6:          # z in [7.45, 25.0]
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.1, scale: 0.05}
    proposal: 0.05
    latex: x_\mathrm{HII}^{(6)}

  # --- ampiezza: libera, la CMB la vede ------------------------------------
  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}
    proposal: 2.0e-11
    latex: A_s

  # --- cosmologia fissa: Pagano et al. 2020, Tab. 3, TTTEEE+lowE-S2 ---------
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 2.0328

  # --- derivato -------------------------------------------------------------
  tau_reio:
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: binned
    reio_bin_fixed_scheme: True     # True = usa reio_bin_edges qui sotto
    reio_bin_edges: [5.35, 6.05, 6.45, 6.75, 7.15, 7.45, 25.0]
    z_max: 30.0
    z_points: 250
    extra_args:
      N_ncdm: 1
      m_ncdm: 0.06
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False
  elica.hybridHL: null
  planck_2018_lowl.TT: null

sampler:
  mcmc:
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    max_tries: 10000
    learn_proposal: True

output: chains/binned_cmb/C6/binned_C6_corecon_ELiCA_lowTT
