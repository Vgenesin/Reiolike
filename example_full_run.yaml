likelihood:
  # 1. Standard Likelihoods (es. Planck 2018)
  # Assicurati di aver installato i dati di Planck (cobaya-install planck_2018_lowl.TT ...)
  # Se non li hai, commenta queste righe.
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  
  # 2. La tua Likelihood Custom (ReioLike)
  coreconlike.ReioLike:
    # Opzionale: Path alla libreria esterna se non installata
    # corecon_path: "/path/to/corecon/"
    corecon_class: "CoreconLike" # Usa la classe 'CoreconLike' per i calcoli idrogeno neutro

    # Configurazione specifica per questo run
    data_file: "/Users/valentinagenesini/Documents/thesis/cobaya_corecon/corecon_config.yaml"
    reio_model: "flex_knots"  # Esempio: usiamo un modello a nodi flessibili
    
    # Altri argomenti opzionali
    l_max: 50             # Fino a che l ci serve lo spettro EE? (per compatibilità con altre like)
    extra_args:
       mode: "high_precision"

params:
  # Parametri della Reionizzazione (SAMPLATI)
  reio_z_re:
    prior:
      min: 5.0
      max: 15.0
    ref: 8.0
    latex: z_\mathrm{re}
    
  reio_delta_z:
    prior:
      min: 0.1
      max: 5.0
    ref: 1.5
    latex: \Delta z_\mathrm{re}

  # Parametri Cosmologici di base (ridotti per test)
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref: 3.05
    drop: true
    latex: \ln(10^{10} A_\mathrm{s})
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref: 0.965
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 20
      max: 100
    ref: 67.5
    latex: H_0
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref: 0.0224
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref: 0.12
    latex: \Omega_\mathrm{c} h^2
  
  # --- Parametri per la Reionizzazione (CLASS) ---
  # Se usi corecon, probabilmente vuoi variare tau o la storia di reionizzazione.
  tau_reio:
    prior:
      min: 0.01
      max: 0.2
    ref: 0.054
    latex: \tau_\mathrm{reio}
    
  # Esempio: Se il tuo modello 'flex_knots' richiede parametri extra
  # che CLASS deve conoscere o che 'elica' userà:
  # reio_z_knot_1:
  #   prior: {min: 5, max: 10}
  #   ref: 7.0

  # --- Nuisance parameters per Planck ---
  # (Solo un esempio ridotto, Planck ne ha molti)
  A_planck:
    prior:
      min: 0.9
      max: 1.1
    ref: 1.0

theory:
  classy:
    extra_args:
      # output richiesti
      output: tCl,pCl,lCl
      lensing: yes
      
      # Configurazioni CLASS specifiche
      N_ncdm: 1
      deg_ncdm: 0
      m_ncdm: 0.06
      T_ncdm: 0.71611
      
      # Se la storia di reionizzazione personalizzata richiede argomenti per CLASS:
      # reio_parametrization: reio_camb  (o altro supportato da CLASS)

sampler:
  mcmc:
    # Opzioni per il campionamento (Metropolis-Hastings)
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    covmat: auto          # Usa una matrice di covarianza automatica o passane una file
    Rminus1_stop: 0.01    # Criterio di convergenza (Gelman-Rubin)
    max_tries: 1000

output: chains/full_run_test_
force: true
