likelihood:
  coreconlike.CoreconLikelihood:
    # Opzionale: path se corecon non è installato globalmente
    # corecon_path: "/path/to/corecon/" 
    corecon_module: "corecon.likelihood"
    corecon_class: "CoreconLike"

params:
  # Parametri cosmologici
  H0:
    prior:
      min: 60
      max: 80
    ref: 67.5
    latex: H_0
  omega_b: 0.022
  omega_cdm: 0.12
  A_s: 2.1e-9
  n_s: 0.965
  tau_reio:
    prior:
      min: 0.04
      max: 0.08
    ref: 0.06
    latex: \tau_\mathrm{reio}

theory:
  classy:
    extra_args:
      output: tCl,pCl,lCl
      lensing: no
      l_max_scalars: 100

sampler:
  evaluate:
    override:
      tau_reio: 0.054 # Proviamo a valutare in un punto specifico

debug: true
