# Run flexknot_3flex: flexknot 3-flex di Ilic et al. 2025 (arXiv:2504.13254,
# Sez. 2.4, Tab. 1) con tutta l'astrofisica.
# 3-flex: campionati z1, z2, z3 ~ U(5, 25), x_HII2 ~ U(0, 1) e A_s; PCHIP in z.
# Likelihood: astrofisica (corecon_config.yaml) + ELiCA + Planck lowl.TT.
# Cosmologia fissa: Pagano et al. 2020, Tab. 3, TTTEEE+lowE-S2.
# Da confrontare con run_ilic/flexknot_3flex_ilic.yaml (solo CMB PR4, LCDM libero).
#
# Si lancia dalla radice del repository:
#   sbatch run_flexknot/run_flexknot_3flex.sh

debug: False

params:
  # --- reionizzazione: 3-flex (Ilic Sez. 2.4, Tab. 1) ------------------------
  # nodo 1 a x_e = 1 + f_He, nodo 3 al valore residuo (fissati dal pacchetto);
  # x_e del nodo 2 = reio_flex_xHII2 x (1 + f_He), cioe U(0, 1 + f_He).
  # I punti con nodi non ordinati (z1 < z2 < z3) vengono scartati prima di
  # CLASS (costo zero): il prior effettivo e uniforme sulla regione ordinata.
  reio_flex_z1:
    prior: {min: 5.0, max: 25.0}
    ref: {dist: norm, loc: 5.6, scale: 0.3}
    proposal: 0.3
    latex: z_1
  reio_flex_z2:
    prior: {min: 5.0, max: 25.0}
    ref: {dist: norm, loc: 9.0, scale: 0.5}
    proposal: 0.5
    latex: z_2
  reio_flex_z3:
    prior: {min: 5.0, max: 25.0}
    ref: {dist: norm, loc: 14.0, scale: 1.0}
    proposal: 1.5
    latex: z_3
  reio_flex_xHII2:
    prior: {min: 0.0, max: 1.0}
    ref: {dist: norm, loc: 0.3, scale: 0.05}
    proposal: 0.1
    latex: x_{\mathrm{HII},2}

  A_s:
    prior: {min: 1.5e-9, max: 3.5e-9}
    ref: {dist: norm, loc: 2.120e-9, scale: 3.0e-11}
    proposal: 2.0e-11
    latex: A_s

  # cosmologia fissa: Pagano et al. 2020 (arXiv:1908.09856), Tab. 3, TTTEEE+lowE-S2
  n_s: 0.9651
  omega_b: 0.02237
  omega_cdm: 0.1201
  H0: 67.32
  N_ur: 0.00441              # 3 neutrini massivi degeneri: N_eff = 3.044

  tau_reio:                  # derivato
    latex: \tau_\mathrm{reio}

theory:
  Reiolike.ReioTheory:
    reio_model: flexknot
    reio_flex_interp: pchip       # N-flex (PCHIP); 'linear' darebbe il 3-knots

    z_max: 30.0
    z_points: 250
    extra_args:
      # 3 neutrini massivi degeneri da 0.02 eV (somma 0.06 eV)
      N_ncdm: 1
      deg_ncdm: 3
      m_ncdm: 0.02
      T_ncdm: 0.71611

likelihood:
  Reiolike.ReioLike:
    corecon_config_file: corecon_config.yaml
    print_sigma_table: False
  elica: null
  planck_2018_lowl.TT: null

sampler:
  mcmc:
    Rminus1_stop: 0.01        # convergenza delle medie (come il paper)
    Rminus1_cl_stop: 0.1      # convergenza degli intervalli
    max_tries: 10000
    learn_proposal: True

output: chains/flexknot_3flex/flexknot_3flex_corecon_ELiCA_lowTT
